[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apify-store-radar"
version = "0.1.0"
description = "Daily snapshots of the Apify Store with niche demand, supply, growth and quality-gap metrics."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
