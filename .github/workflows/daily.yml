name: daily-snapshot

on:
  schedule:
    - cron: "23 5 * * *" # 05:23 UTC, away from the top of the hour when GitHub's queue is busiest
  workflow_dispatch:

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the day's file to the `data` branch
    steps:
      - uses: actions/checkout@v4

      # History lives on its own branch so `main` stays code-only. The branch is created on the first run.
      - name: Attach the data branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" data > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "$REMOTE" data
          else
            git init --quiet --initial-branch data data
            git -C data remote add origin "$REMOTE"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: Collect today's snapshot and build the report
        run: python -m radar run

      - name: Save the snapshot on the data branch
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "snapshot $(date -u +%F)" || echo "nothing new to commit"
          git push origin data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
